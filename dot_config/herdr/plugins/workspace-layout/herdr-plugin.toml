id = "caleb.workspace-layout"
name = "Workspace Layout"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Configure tabs, panes, and startup commands for new workspaces"
platforms = ["linux", "macos"]

[[actions]]
id = "apply"
title = "Apply workspace layout"
contexts = ["workspace"]
command = ["node", "index.mjs", "apply"]

[[actions]]
id = "choose"
title = "Choose workspace layout"
contexts = ["workspace"]
command = ["node", "open-picker.mjs"]

[[events]]
on = "worktree.created"
command = ["node", "index.mjs", "event"]

[[panes]]
id = "picker"
title = "Choose workspace layout"
placement = "popup"
width = "60%"
height = 18
command = ["node", "picker.mjs"]
