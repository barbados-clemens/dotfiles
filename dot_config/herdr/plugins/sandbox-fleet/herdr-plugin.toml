id = "caleb.sandbox-fleet"
name = "Sandbox Fleet"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Dispatch, join, and tear down workdir microVM sandboxes from a popup"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open sandbox fleet"
contexts = ["workspace"]
command = ["node", "open-picker.mjs"]

[[panes]]
id = "picker"
title = "Sandbox fleet"
placement = "popup"
width = "70%"
height = 22
command = ["node", "picker.mjs"]
